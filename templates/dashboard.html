<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Isabella v7.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0e27; color: #fff; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .header { background: linear-gradient(135deg, #00ff88, #00cc6a); padding: 2rem; border-radius: 10px; margin-bottom: 2rem; color: #000; }
        .header h1 { margin-bottom: 0.5rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
        .stat-card { background: linear-gradient(135deg, #1a1f3a, #0f1420); padding: 1.5rem; border-radius: 10px; border-left: 4px solid #00ff88; }
        .stat-card h3 { color: #aaa; font-size: 0.9rem; margin-bottom: 1rem; text-transform: uppercase; }
        .stat-card .value { font-size: 2rem; color: #00ff88; font-weight: bold; }
        .section { background: linear-gradient(135deg, #1a1f3a, #0f1420); padding: 2rem; border-radius: 10px; margin-bottom: 2rem; }
        .section h2 { color: #00ff88; margin-bottom: 1.5rem; border-bottom: 2px solid #00ff88; padding-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #aaa; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; background: #0f1420; border: 1px solid #333; border-radius: 5px; color: #fff; }
        .btn { padding: 0.75rem 2rem; background: #00ff88; color: #000; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .btn:hover { background: #00cc6a; }
        .response { background: #0f1420; padding: 1rem; border-radius: 5px; margin-top: 1rem; border-left: 3px solid #00ff88; }
        .response pre { color: #00ff88; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard - Isabella v7.0</h1>
            <p>© Juan Alberto López Vázquez - Único Creador</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Auditorías Realizadas</h3>
                <div class="value" id="audits">0</div>
            </div>
            <div class="stat-card">
                <h3>Vulnerabilidades Encontradas</h3>
                <div class="value" id="vulnerabilities">0</div>
            </div>
            <div class="stat-card">
                <h3>Herramientas Disponibles</h3>
                <div class="value" id="tools">600+</div>
            </div>
            <div class="stat-card">
                <h3>Estado del Sistema</h3>
                <div class="value" id="status" style="color: #4ade80;">✅ Operacional</div>
            </div>
        </div>

        <div class="section">
            <h2>🌐 Navegación Web</h2>
            <div class="form-group">
                <label>URL a Navegar:</label>
                <input type="text" id="navUrl" placeholder="https://example.com" value="https://example.com">
            </div>
            <label>
                <input type="checkbox" id="useTor"> Usar Tor (anonimato)
            </label>
            <button class="btn" onclick="navigate()">🌍 Navegar</button>
            <div id="navResponse" class="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>💥 Escanear Vulnerabilidades</h2>
            <div class="form-group">
                <label>URL a Escanear:</label>
                <input type="text" id="scanUrl" placeholder="https://example.com/admin.php" value="https://example.com/admin.php">
            </div>
            <button class="btn" onclick="scan()">🔍 Escanear</button>
            <div id="scanResponse" class="response" style="display:none;"></div>
        </div>

        <div class="section">
            <h2>📥 Extraer Archivos</h2>
            <div class="form-group">
                <label>URL del Sitio:</label>
                <input type="text" id="extractUrl" placeholder="https://example.com" value="https://example.com">
            </div>
            <div class="form-group">
                <label>Tipos de Archivo (separados por comas):</label>
                <input type="text" id="fileTypes" placeholder=".pdf,.zip,.doc" value=".pdf,.zip,.doc">
            </div>
            <button class="btn" onclick="extract()">📥 Extraer</button>
            <div id="extractResponse" class="response" style="display:none;"></div>
        </div>
    </div>

    <script>
        // Verificar salud del sistema
        fetch('/api/health')
            .then(r => r.json())
            .then(d => {
                if (d.status === 'healthy') {
                    document.getElementById('status').textContent = '✅ Operacional';
                    document.getElementById('status').style.color = '#4ade80';
                }
            })
            .catch(() => {
                document.getElementById('status').textContent = '❌ Desconectado';
                document.getElementById('status').style.color = '#ff6b6b';
            });

        function navigate() {
            const url = document.getElementById('navUrl').value;
            const useTor = document.getElementById('useTor').checked;
            const div = document.getElementById('navResponse');
            
            div.innerHTML = '⏳ Navegando...';
            div.style.display = 'block';
            
            fetch('/api/pentesting/navigate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, use_tor: useTor })
            })
            .then(r => r.json())
            .then(d => {
                div.innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
            })
            .catch(e => div.innerHTML = '<pre style="color: #ff6b6b;">Error: ' + e + '</pre>');
        }

        function scan() {
            const url = document.getElementById('scanUrl').value;
            const div = document.getElementById('scanResponse');
            
            div.innerHTML = '⏳ Escaneando...';
            div.style.display = 'block';
            
            fetch('/api/pentesting/scan-vulnerabilities', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            })
            .then(r => r.json())
            .then(d => {
                div.innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
            })
            .catch(e => div.innerHTML = '<pre style="color: #ff6b6b;">Error: ' + e + '</pre>');
        }

        function extract() {
            const url = document.getElementById('extractUrl').value;
            const fileTypes = document.getElementById('fileTypes').value.split(',').map(t => t.trim());
            const div = document.getElementById('extractResponse');
            
            div.innerHTML = '⏳ Extrayendo...';
            div.style.display = 'block';
            
            fetch('/api/pentesting/extract-files', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, file_types: fileTypes })
            })
            .then(r => r.json())
            .then(d => {
                div.innerHTML = '<pre>' + JSON.stringify(d, null, 2) + '</pre>';
            })
            .catch(e => div.innerHTML = '<pre style="color: #ff6b6b;">Error: ' + e + '</pre>');
        }
    </script>
</body>
</html>
