version: '3.8'

services:
  isabella:
    build: .
    container_name: isabella-v7
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - isabella-network

  # Base de datos (opcional)
  # postgres:
  #   image: postgres:13
  #   container_name: isabella-db
  #   environment:
  #     - POSTGRES_USER=isabella
  #     - POSTGRES_PASSWORD=secure_password
  #     - POSTGRES_DB=isabella_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - isabella-network

volumes:
  postgres_data:

networks:
  isabella-network:
    driver: bridge
